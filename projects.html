<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Mini project PHP sederhana untuk pemula." />
    <title>Mini Project | PHP Beginner Lab</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
    <link rel="icon" href="assets/images/favicon.png" type="image/png" />
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body data-page="projects">
    <div id="appNav"></div>
    <main>
      <section class="page-hero">
        <div class="container">
          <span class="eyebrow"><i class="bi bi-rocket-takeoff"></i> Mini Project</span>
          <h1>Ubah konsep PHP kecil menjadi fitur nyata</h1>
          <p>Pilih project dari materi yang sudah dipelajari: form, validasi, array, session, file JSON, database, CRUD, upload, dan dashboard sederhana.</p>
        </div>
      </section>
      <section class="section-block" id="projects">
        <div class="container"><div class="row g-3 g-lg-4" id="projectGrid"></div></div>
      </section>
    </main>
    <div id="appFooter"></div>
    <div id="appToast"></div>
    <div class="modal fade project-preview-modal" id="projectPreviewModal" tabindex="-1" aria-labelledby="projectPreviewTitle" aria-hidden="true">
      <div class="modal-dialog modal-xl modal-dialog-centered modal-dialog-scrollable">
        <div class="modal-content">
          <div class="modal-header">
            <div>
              <span class="eyebrow"><i class="bi bi-eye"></i> Preview project</span>
              <h2 class="modal-title" id="projectPreviewTitle">Contoh project</h2>
              <p class="mb-0" id="projectPreviewDescription"></p>
            </div>
            <button class="btn-close" type="button" data-bs-dismiss="modal" aria-label="Tutup preview"></button>
          </div>
          <div class="modal-body"><div class="project-example-modal-stage" id="projectPreviewBody"></div></div>
          <div class="modal-footer"><button class="btn btn-soft" type="button" data-bs-dismiss="modal">Tutup preview</button></div>
        </div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/data.js"></script>
    <script src="assets/js/progress.js"></script>
    <script src="assets/js/layout.js"></script>
    <script src="assets/js/app.js"></script>
  </body>
</html>
