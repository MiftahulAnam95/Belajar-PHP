<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 620" role="img" aria-labelledby="title desc">
  <title id="title">Workspace belajar PHP</title>
  <desc id="desc">Ilustrasi laptop dengan panel kode PHP, form HTML, server lokal, database, dan output browser.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbf7ff"/>
      <stop offset="0.55" stop-color="#f3e8ff"/>
      <stop offset="1" stop-color="#e0f7fa"/>
    </linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#182035"/>
      <stop offset="1" stop-color="#2c1f4f"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="22" stdDeviation="24" flood-color="#31215f" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="880" height="620" rx="34" fill="url(#bg)"/>
  <circle cx="734" cy="114" r="70" fill="#c4b5fd" opacity="0.42"/>
  <circle cx="134" cy="492" r="84" fill="#67e8f9" opacity="0.25"/>
  <g opacity="0.34">
    <path d="M72 92h736M72 172h736M72 252h736M72 332h736M72 412h736M72 492h736" stroke="#d8c7ff"/>
    <path d="M132 52v512M252 52v512M372 52v512M492 52v512M612 52v512M732 52v512" stroke="#d8c7ff"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="122" y="96" width="636" height="392" rx="28" fill="#ffffff" stroke="#d8c7ff" stroke-width="2"/>
    <rect x="154" y="126" width="572" height="320" rx="20" fill="url(#screen)"/>
    <rect x="106" y="476" width="668" height="38" rx="18" fill="#ffffff" stroke="#d8c7ff" stroke-width="2"/>
    <path d="M364 488h152c-6 13-20 20-41 20h-70c-21 0-35-7-41-20Z" fill="#e7ddff"/>
  </g>

  <g transform="translate(182 154)">
    <rect width="244" height="254" rx="16" fill="#0f172a" stroke="#475569"/>
    <rect width="244" height="42" rx="16" fill="#1e293b"/>
    <circle cx="24" cy="21" r="6" fill="#f87171"/>
    <circle cx="44" cy="21" r="6" fill="#fbbf24"/>
    <circle cx="64" cy="21" r="6" fill="#34d399"/>
    <text x="88" y="26" fill="#c4b5fd" font-family="JetBrains Mono, monospace" font-size="13" font-weight="700">index.php</text>
    <text x="22" y="74" fill="#a78bfa" font-family="JetBrains Mono, monospace" font-size="16">&lt;?php</text>
    <text x="22" y="106" fill="#f8fafc" font-family="JetBrains Mono, monospace" font-size="15">$nama = "Nadia";</text>
    <text x="22" y="138" fill="#f8fafc" font-family="JetBrains Mono, monospace" font-size="15">$skills = ["HTML",</text>
    <text x="98" y="166" fill="#f8fafc" font-family="JetBrains Mono, monospace" font-size="15">"CSS", "JS", "PHP"];</text>
    <text x="22" y="204" fill="#67e8f9" font-family="JetBrains Mono, monospace" font-size="15">foreach ($skills as $skill)</text>
    <text x="22" y="236" fill="#fbbf24" font-family="JetBrains Mono, monospace" font-size="15">echo $skill;</text>
  </g>

  <g transform="translate(452 154)">
    <rect width="244" height="128" rx="16" fill="#ffffff" stroke="#d8c7ff" stroke-width="2"/>
    <text x="20" y="34" fill="#6d28d9" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="800">FORM INPUT</text>
    <rect x="20" y="54" width="204" height="22" rx="8" fill="#f3e8ff"/>
    <rect x="20" y="88" width="112" height="24" rx="8" fill="url(#purple)"/>
    <text x="42" y="105" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="800">Kirim POST</text>
  </g>

  <g transform="translate(452 306)">
    <rect width="244" height="102" rx="16" fill="#ffffff" stroke="#d8c7ff" stroke-width="2"/>
    <text x="20" y="34" fill="#0f766e" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="800">OUTPUT HTML</text>
    <text x="20" y="63" fill="#1f1b2d" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="800">Halo, Nadia</text>
    <text x="20" y="86" fill="#647089" font-family="Inter, Arial, sans-serif" font-size="13">Server mengirim halaman siap tampil.</text>
  </g>

  <g transform="translate(604 72)">
    <rect width="142" height="62" rx="16" fill="#111827"/>
    <text x="18" y="25" fill="#c4b5fd" font-family="JetBrains Mono, monospace" font-size="13">localhost:8000</text>
    <path d="M22 42h98" stroke="#34d399" stroke-width="6" stroke-linecap="round"/>
  </g>

  <g transform="translate(116 72)">
    <rect width="154" height="62" rx="16" fill="#ffffff" stroke="#d8c7ff" stroke-width="2"/>
    <text x="18" y="27" fill="#6d28d9" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="800">PHP DASAR</text>
    <text x="18" y="47" fill="#647089" font-family="Inter, Arial, sans-serif" font-size="12">HTML + CSS + JS lanjut</text>
  </g>

  <g transform="translate(586 438)">
    <rect width="160" height="64" rx="18" fill="#ffffff" stroke="#d8c7ff" stroke-width="2"/>
    <ellipse cx="40" cy="24" rx="24" ry="10" fill="#7c3aed" opacity="0.22"/>
    <path d="M16 24v18c0 6 11 11 24 11s24-5 24-11V24" fill="#f3e8ff" stroke="#7c3aed" stroke-width="2"/>
    <text x="80" y="28" fill="#1f1b2d" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="800">Database</text>
    <text x="80" y="48" fill="#647089" font-family="Inter, Arial, sans-serif" font-size="12">PDO + CRUD</text>
  </g>
</svg>
